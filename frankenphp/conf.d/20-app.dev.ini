; See https://docs.docker.com/desktop/features/networking/networking-how-tos/#connect-a-container-to-a-service-on-the-host
; See https://github.com/docker/for-linux/issues/264
; The `client_host` below may optionally be replaced with `discover_client_host=yes`
; Add `start_with_request=yes` to start debug session on each request
xdebug.client_host = host.docker.internal

; Dev runs with APP_DEBUG=1: the Doctrine profiler keeps every query (with backtrace) and
; Monolog buffers debug logs, so applying a full supplier catalogue (~2,500 rows) in one
; request exceeds 128M. Production (debug off) stays at the image default.
memory_limit = 512M
; Mirror 10-app.ini upload limits so they apply in dev without rebuilding the image.
upload_max_filesize = 20M
post_max_size = 24M
