---
# Development environment override
services:
  php:
    image: ${IMAGES_PREFIX:-}hockey-staff-php-dev
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      # If you develop on Mac or Windows you can remove the vendor/ directory
      #  from the bind-mount for better performance by enabling the next line:
      #- /app/vendor
    environment:
      FRANKENPHP_WORKER_CONFIG: watch
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
      APP_ENV: "${APP_ENV:-dev}"
      MAILER_DSN: smtp://mailpit:1025
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true

  worker:
    image: ${IMAGES_PREFIX:-}hockey-staff-php-dev
    build:
      context: .
      target: frankenphp_dev
    restart: unless-stopped
    # The image healthcheck probes FrankenPHP, which the worker does not run
    healthcheck:
      disable: true
    depends_on:
      php:
        condition: service_started
      hockey-staff-database:
        condition: service_healthy
    volumes:
      - ./:/app
      # Shared with php so the worker can read files uploaded via HTTP
      - app_storage:/app/var/storage
      # Shared log dir so fluent-bit captures worker logs too
      - app_log:/app/var/log
    environment:
      APP_ENV: "${APP_ENV:-dev}"
      MAILER_DSN: smtp://mailpit:1025
      APP_SECRET: ${APP_SECRET:-ChangeThisSecretKeyToSomethingUniqueAndRandom}
      DATABASE_URL: postgresql://${POSTGRES_USER:-hockey_staff}:${POSTGRES_PASSWORD:-hockey_staff}@${POSTGRES_HOST:-hockey-staff-database}:5432/${POSTGRES_DB:-hockey_staff}?serverVersion=${POSTGRES_VERSION:-18}&charset=${POSTGRES_CHARSET:-utf8}
      MERCURE_URL: ${CADDY_MERCURE_URL:-http://php/.well-known/mercure}
      MERCURE_PUBLIC_URL: ${CADDY_MERCURE_PUBLIC_URL:-https://${SERVER_NAME:-hockey-staff.localhost}/.well-known/mercure}
      MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_JWT_ISSUER: ${CADDY_MERCURE_JWT_ISSUER:-https://${SERVER_NAME:-hockey-staff.localhost}}
    networks:
      - ced4it-network
    # --time-limit + restart: unless-stopped makes the worker auto-reload on code
    # changes in dev (exits every 5 min, compose restarts it fresh).
    command:
      - php
      - -d
      - memory_limit=512M
      - bin/console
      - messenger:consume
      - async
      - scheduler_default
      - -vv
      - --time-limit=300
      - --memory-limit=512M

  mailpit:
    image: axllent/mailpit:v1.32
    restart: unless-stopped
    ports:
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - ced4it-network

  fluent-bit:
    image: fluent/fluent-bit:5.1
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
    volumes_from:
      - php:ro
    env_file:
      # LOGS_MANAGER_API_KEY
      - path: .env.local
        required: false
    extra_hosts:
      - logs-manager.localhost:host-gateway
    depends_on:
      - php
    networks:
      - ced4it-network

###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###
