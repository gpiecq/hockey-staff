[SERVICE]
    Flush        5
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf
    # Expose /api/v1/metrics/prometheus, scrape par docker-manager/prometheus.
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020

[INPUT]
    Name             tail
    Path             /app/var/log/json-*.log
    Parser           symfony_json
    Tag              symfony.hockey-staff
    Refresh_Interval 5
    Rotate_Wait      30
    Mem_Buf_Limit    5MB

[OUTPUT]
    Name             http
    Match            symfony.*
    Host             logs-manager.localhost
    Port             443
    URI              /api/logs/ingest
    Format           json
    Json_Date_Key    false
    tls              On
    tls.verify       Off
    Header           Authorization Bearer ${LOGS_MANAGER_API_KEY}
    Header           Content-Type application/json
    Retry_Limit      3

# ------------------------------------------------------------
# OUTPUT : envoi vers Loki (stack docker-manager, exploration Grafana)
# Second consommateur du meme flux. Joignable via ced4it-network,
# auquel Loki est attache.
# ------------------------------------------------------------
[OUTPUT]
    Name                     loki
    Match                    symfony.*
    Host                     docker-manager-loki
    Port                     3100
    Labels                   job=symfony, app=hockey-staff
    Label_Keys               $channel,$level_name,$environment
    Line_Format              json
    Retry_Limit              5
    storage.total_limit_size 50M
